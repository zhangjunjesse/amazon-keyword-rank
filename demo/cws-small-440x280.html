<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Chrome 商店小宣传图 440x280</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 220px; height: 140px; /* 2x deviceScaleFactor 渲染 => 输出 440x280 */
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .stage {
    position: relative;
    width: 220px; height: 140px;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 18px;
    background:
      radial-gradient(circle at 92% 6%, rgba(255,153,0,.22), transparent 48%),
      radial-gradient(circle at 4% 100%, rgba(26,156,91,.14), transparent 45%),
      linear-gradient(160deg, #fffaf3 0%, #fff7ec 46%, #fff2e0 100%);
    overflow: hidden;
  }
  .brand {
    display: flex; align-items: center; gap: 7px;
    margin-bottom: 8px;
  }
  .logo {
    width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
    background: linear-gradient(135deg, #ff9900, #ff7a00);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(255,122,0,.35);
    font: 900 13px/1 Arial; color: #fff;
  }
  .brand-name { font-size: 9.5px; font-weight: 800; color: #1f2329; line-height: 1.25; }

  h1 { font-size: 15.5px; font-weight: 800; color: #1f2329; line-height: 1.28; margin-bottom: 6px; }
  h1 em { font-style: normal; color: #ff7a00; }

  .sub { font-size: 9.5px; color: #6b7280; font-weight: 600; line-height: 1.5; margin-bottom: 9px; }

  .feats { display: flex; flex-wrap: wrap; gap: 5px; }
  .feat {
    display: flex; align-items: center; gap: 4px;
    background: #fff; border: 1px solid #f0e2c8;
    border-radius: 12px; padding: 3px 8px;
    font-size: 8px; font-weight: 700; color: #4a3418;
    box-shadow: 0 1px 3px rgba(31,35,41,.05);
  }
  .feat .dot { width: 4px; height: 4px; border-radius: 50%; background: #ff9900; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand">
      <div class="logo">A</div>
      <div class="brand-name">亚马逊关键词<br>排名查询器</div>
    </div>
    <h1>批量查 <em>关键词×ASIN</em><br>搜索排名</h1>
    <div class="sub">自动识别广告位 · 一键导出 Excel</div>
    <div class="feats">
      <div class="feat"><span class="dot"></span>21 个站点</div>
      <div class="feat"><span class="dot"></span>Excel 导出</div>
    </div>
  </div>
</body>
</html>

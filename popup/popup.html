<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon 关键词排名查询器</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">A</span>
      <div>
        <h1>Amazon 关键词排名查询器</h1>
        <div id="statusLine" class="status">就绪</div>
      </div>
    </div>
    <span id="siteTag" class="site-tag" title="当前站点将作为查询市场">—</span>
  </header>

  <section class="inputs">
    <div class="field">
      <label for="keywords">关键词 <span class="hint">（每行一个）</span></label>
      <textarea id="keywords" rows="4" placeholder="例如：wireless earbuds&#10;bluetooth headphones&#10;noise cancelling"></textarea>
    </div>
    <div class="field">
      <label for="asins">ASIN <span class="hint">（每行一个，10 位字母数字）</span></label>
      <textarea id="asins" rows="4" placeholder="例如：B0C1234567&#10;B09ABCDEFG"></textarea>
    </div>
    <div class="options">
      <div class="opt">
        <label for="pages">扫描页数</label>
        <select id="pages">
          <option value="1" selected>第 1 页</option>
          <option value="2">前 2 页</option>
          <option value="3">前 3 页</option>
        </select>
      </div>
      <div class="opt">
        <label for="delay">关键词间隔（秒）</label>
        <input id="delay" type="number" min="0" max="30" step="1" value="2" />
        <span class="hint">太短易触发风控</span>
      </div>
    </div>
    <div class="actions">
      <button id="startBtn" class="primary">开始查询</button>
      <button id="stopBtn" disabled>停止</button>
    </div>
  </section>

  <section id="proWrap" class="pro-wrap">
    <div id="proLocked" class="pro-box">
      <div class="pro-head"><span class="pro-lock">🔒</span> <b>Pro 版</b><span id="proTag" class="pro-tag">免费试用</span></div>
      <div class="pro-benefits">免费用户可完整体验 3 次查询 · Pro 解锁无限次查询</div>
      <div class="pro-price-row">
        <div class="pro-price" id="proPrice"></div>
        <a id="proBuy" class="pro-buy-btn" target="_blank" rel="noreferrer">购买激活码</a>
      </div>
      <div class="pro-activate">
        <input id="proKey" placeholder="粘贴激活码（ARTK-… 或 Lemon Squeezy 码）" autocomplete="off" />
        <button id="proActivate">激活</button>
      </div>
      <div id="proMsg" class="pro-msg"></div>
    </div>
    <div id="proUnlocked" class="pro-box pro-unlocked hidden">
      <div class="pro-head"><span class="pro-lock">✅</span> <b>Pro 已激活</b></div>
      <div class="pro-benefits" id="proInfo"></div>
      <div class="pro-activate"><button id="proDeactivate" class="pro-deactivate">解除绑定</button></div>
    </div>
  </section>

  <section id="progressWrap" class="progress-wrap hidden">
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <div id="progressText" class="progress-text"></div>
  </section>

  <section id="resultWrap" class="result-wrap hidden">
    <div class="result-toolbar">
      <div class="tabs">
        <button data-tab="matrix" class="tab active">排名总表</button>
        <button data-tab="detail" class="tab">明细</button>
      </div>
      <div class="rank-mode">
        <label><input type="radio" name="rankMode" value="natural" checked /> 自然排名</label>
        <label><input type="radio" name="rankMode" value="total" /> 总排名</label>
      </div>
      <div class="export">
        <button id="exportXlsx" disabled>导出 Excel</button>
        <button id="exportCsv" disabled>导出 CSV</button>
      </div>
    </div>
    <div id="matrixView" class="view"></div>
    <div id="detailView" class="view hidden"></div>
    <div id="errorList" class="error-list"></div>
  </section>

  <footer>
    <span id="footerInfo"></span>
    <span class="tip">提示：查询时插件会在后台标签页打开亚马逊搜索页，关键词之间自动留间隔，请保持亚马逊标签页打开。</span>
  </footer>

  <script src="../vendor/xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
